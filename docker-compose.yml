services:
  priestessbot:
    build: .
    container_name: priestessbot
    restart: unless-stopped
    environment:
      PRIESTESS_CONFIG_PATH: /app/config/config.json
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/config:/app/config
      - ./deploy/data:/app/data
      - ./deploy/logs:/app/logs
      - ./deploy/plugins:/app/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
